<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Live World</title>
    <style>
        /* 全体のリセットと基本スタイル */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px 20px 120px 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 投稿シミュレーター用の管理パネル */
        .admin-panel {
            background-color: #fff;
            border: 2px dashed #ff4757;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-info {
            font-size: 0.9rem;
            color: #555;
        }
        .admin-info strong {
            color: #ff4757;
        }
        .post-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .post-btn:hover {
            background-color: #26af5f;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-left: 5px solid #ff4757;
            padding-left: 10px;
        }

        /* 2カラムFlexboxコンテナ */
        .live-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* 配信カードのスタイル */
        .live-card {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1 1 calc(50% - 10px); 
            max-width: calc(50% - 10px);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        @media (max-width: 600px) {
            .live-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
        .live-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }

        /* サムネイル */
        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #222;
        }
        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-live {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff4757;
            color: #fff;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .viewer-count {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        /* テキスト部分 */
        .live-info {
            padding: 12px;
            display: flex;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ccc;
            flex-shrink: 0;
            object-fit: cover;
        }
        .text-content {
            flex-grow: 1;
            overflow: hidden;
        }
        .live-title {
            font-size: 0.95rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 4px;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .streamer-name {
            font-size: 0.8rem;
            color: #666;
        }

        /* ページネーション */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            min-width: 40px;
            height: 40px;
            padding: 0 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            text-decoration: none;
        }
        .page-btn:hover {
            background-color: #f0f0f0;
            border-color: #bbb;
        }
        .page-btn.active {
            background-color: #ff4757;
            color: #fff;
            border-color: #ff4757;
            cursor: default;
        }
        .page-btn.disabled {
            background-color: #e9e9e9;
            color: #999;
            border-color: #ddd;
            cursor: not-allowed;
            pointer-events: none;
        }
        .page-ellipsis {
            color: #999;
            padding: 0 4px;
            font-weight: bold;
        }





/* ==========================================
           画面最下部：固定フッターナビゲーション
           ========================================== */
           .bottom-nav {
            display: flex;
            position: fixed;
            bottom: 30px; /* コピーライト（高さ30px）の上に固定配置 */
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-top: 1px solid #eff3f4;
            justify-content: space-around;
            align-items: center;
            z-index: 80;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #536471;
            font-size: 9px;
            cursor: pointer;
            flex: 1;
            padding: 5px 0;
            text-decoration: none;
        }
        .bottom-nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .bottom-nav-item.active {
            color: #0f1419;
        }

        /* 新設：最下部固定コピーライト表示 */
        .footer-copyright {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background-color: #f7f9f9;
            color: #536471;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #eff3f4;
            z-index: 80;
        }






    </style>
</head>
<body>

<div class="container">
    
    <div class="admin-panel">
        <div class="admin-info">
            【デモ用】現在の総投稿（配信）数: <strong id="totalItemsCount">201</strong> 件 / 
            総ページ数: <strong id="totalPagesCount">11</strong> ページ
        </div>
        <button class="post-btn" onclick="simulateNewPost()">＋ 新しいライブ配信を投稿する</button>
    </div>

    <h1 id="pageTitle">注目のライブ配信 (1ページ目)</h1>
    
    <div class="live-grid" id="liveGrid"></div>

    <div class="pagination" id="pagination"></div>
</div>



 <!-- ボトムナビゲーション（コピーライトの上に重なるよう位置変更） -->
 <nav class="bottom-nav" id="bottomNav">
    <a href="ニューワールド.html" class="bottom-nav-item active" id="btnHome" onclick="switchMainTab('timeline'); return false;">
        <i class="fa-solid fa-house"></i>
        <span>ホーム</span>
    </a>
    <a href="リンクリンカー.html" class="bottom-nav-item" id="btnSearch">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>無料</span>
    </a>
    <a href="ライブ.html" class="bottom-nav-item" id="btnVideo" onclick="switchMainTab('video'); return false;">
        <i class="fa-solid fa-video"></i>
        <span>ライブ</span>
    </a>
    <a href="EC.html" class="bottom-nav-item" id="btnLive">
        <i class="fa-regular fa-bell"></i>
        <span>ショップ</span>
    </a>
    <a href="企業.html" class="bottom-nav-item" id="btnCompany">
        <i class="fa-solid fa-shop"></i>
        <span>企業</span>
    </a>
    <a href="通知とDM.html" class="bottom-nav-item" id="btnDM">
        <i class="fa-regular fa-envelope"></i>
        <span>通知とDM</span>
    </a>
</nav>

<!-- 追加：最下部のコピーライト表示エリア -->
<footer class="footer-copyright">
    &copy; 2026 New World. All Rights Reserved.
</footer>



<script>
    const ITEMS_PER_PAGE = 20; // 1ページあたりの表示件数
    
    // アプリ全体の「投稿データ」を保持する配列（初期状態で201件のデータを入れておく）
    let allLivePosts = [];
    let currentPage = 1;

    // 初回起動時：201件のダミーデータを生成して初期表示
    window.onload = function() {
        // 固定の画像配信用シードID
        const sampleImageIds = [1015, 1025, 1062, 1050, 26, 367, 453, 619, 1084, 823, 111, 237, 334, 445, 522, 674, 718, 883, 901, 935];
        
        for (let i = 1; i <= 201; i++) {
            allLivePosts.push({
                id: i,
                title: `【${String(i).padStart(3, '0')}】自動増設デモ：リアルタイムライブストリーム`,
                streamer: `ストリーマー_ch_${i}`,
                viewers: Math.floor(Math.random() * 5000) + 100,
                imgId: sampleImageIds[i % sampleImageIds.length] + (i % 50),
                avatarId: (sampleImageIds[i % sampleImageIds.length] + i) % 1000
            });
        }
        
        // 画面の更新
        updateDashboardInfo();
        renderPage(1);
    };

    // 管理パネルの数字表示を更新する関数
    function updateDashboardInfo() {
        const totalItems = allLivePosts.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE); // 総件数 ÷ 20 からページ数を自動計算（切り上げ）
        
        document.getElementById('totalItemsCount').textContent = totalItems;
        document.getElementById('totalPagesCount').textContent = totalPages;
    }

    // 「新しいライブ配信を投稿する」ボタンを押したときの処理
    function simulateNewPost() {
        const newId = allLivePosts.length + 1;
        
        // 新しい投稿データを配列の【先頭】に追加（最新の投稿が1ページ目に来るように）
        allLivePosts.unshift({
            id: newId,
            title: `【NEW! ${newId}】今さっき投稿された出来たてのライブ配信！`,
            streamer: `新規配信者_${newId}ch`,
            viewers: Math.floor(Math.random() * 300) + 10,
            imgId: 100 + (newId % 500),
            avatarId: (200 + newId) % 1000
        });

        // データの件数とページ総数を再計算
        updateDashboardInfo();
        
        // 現在1ページ目を見ていたら、新しい投稿を反映するために再描画
        if (currentPage === 1) {
            renderPage(1);
        } else {
            // 他のページにいたらページネーションの見た目（ボタンの総数など）だけ更新
            const totalPages = Math.ceil(allLivePosts.length / ITEMS_PER_PAGE);
            updatePaginationUI(currentPage, totalPages);
        }
    }

    // 指定されたページの配信カード20件を描画する関数
    function renderPage(pageNumber) {
        currentPage = pageNumber;
        const totalPages = Math.ceil(allLivePosts.length / ITEMS_PER_PAGE);
        
        // タイトル更新
        document.getElementById('pageTitle').textContent = `注目のライブ配信 (${pageNumber}ページ目 / 全${totalPages}ページ)`;

        const grid = document.getElementById('liveGrid');
        
        // 現在のページに対応する20件を配列から切り出す
        const startIndex = (pageNumber - 1) * ITEMS_PER_PAGE;
        const endIndex = startIndex + ITEMS_PER_PAGE;
        const pageItems = allLivePosts.slice(startIndex, endIndex);

        // HTMLの組み立て
        let html = '';
        pageItems.forEach(item => {
            html += `
                <a href="#" class="live-card">
                    <div class="thumbnail-wrapper">
                        <img src="https://picsum.photos/id/${item.imgId}/600/340" alt="サムネイル">
                        <span class="badge-live">LIVE</span> 
                        <span class="viewer-count">${item.viewers.toLocaleString()} 視聴中</span>
                    </div>
                    <div class="live-info">
                        <img src="https://picsum.photos/id/${item.avatarId}/50/50" alt="アバター" class="avatar">
                        <div class="text-content">
                            <div class="live-title">${item.title}</div>
                            <div class="streamer-name">${item.streamer}</div>
                        </div>
                    </div>
                </a>
            `;
        });
        
        grid.innerHTML = html;

        // ページネーションUIの更新
        updatePaginationUI(pageNumber, totalPages);
    }

    // ページネーションUIの動动生成（最大数が無限に増えても対応可能）
    function updatePaginationUI(currentPage, totalPages) {
        const paginationContainer = document.getElementById('pagination');
        let html = '';

        // 「前へ」ボタン
        if (currentPage === 1) {
            html += `<button class="page-btn disabled">前へ</button>`;
        } else {
            html += `<button class="page-btn" onclick="changePageAction(${currentPage - 1})">前へ</button>`;
        }

        // 動的なページ番号ボタンの生成ロジック
        for (let p = 1; p <= totalPages; p++) {
            // 1ページ目、最終ページ、または現在地の前後2ページ以内なら表示
            if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
                html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="${p === currentPage ? '' : `changePageAction(${p})`}">${p}</button>`;
            } 
            // 省略記号「...」を挟む条件
            else if (p === 2 && currentPage > 4) {
                html += `<span class="page-ellipsis">...</span>`;
            } else if (p === totalPages - 1 && currentPage < totalPages - 3) {
                html += `<span class="page-ellipsis">...</span>`;
            }
        }

        // 「次へ」ボタン
        if (currentPage === totalPages) {
            html += `<button class="page-btn disabled">次へ</button>`;
        } else {
            html += `<button class="page-btn" onclick="changePageAction(${currentPage + 1})">次へ</button>`;
        }

        paginationContainer.innerHTML = html;
    }

    // ページ移動時のスクロール付きアクション
    function changePageAction(pageNumber) {
        renderPage(pageNumber);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
